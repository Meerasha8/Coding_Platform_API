<!DOCTYPE html>
<html>
<head>
  <title>CodeChef API Guide</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
  <h2>CodeChef API</h2>

  <h3>📌 Endpoint</h3>
  <p><code>/codechef/&lt;username&gt;</code></p>

  <h3>📌 What it does</h3>
  <p>Scrapes CodeChef profile to extract rating and problems solved.</p>

  <h3>📌 Returns</h3>
  <ul>
    <li>Current rating</li>
    <li>Rating change</li>
    <li>Total problems solved</li>
  </ul>

  <h3>📌 Try it</h3>
  <input id="username" placeholder="Enter username">
  <button onclick="testCC()">Test API</button>
  <pre id="result"></pre>
</div>

<script>
async function testCC() {
  const user = document.getElementById("username").value;
  const res = await fetch(`/codechef/${user}`);
  const data = await res.json();
  document.getElementById("result").innerText = JSON.stringify(data, null, 2);
}
</script>
</body>
</html>
